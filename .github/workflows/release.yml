name: Release

# Triggers:
# - Push a tag like v0.1.0 to kick off a full multi-OS build and publish
#   to a GitHub Release (created automatically if it doesn't exist yet).
# - Manual run (workflow_dispatch) for dry-run builds that upload
#   artifacts but DON'T publish a Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # needed to upload release assets

env:
  # Opt into Node.js 24 now to avoid the hard cut-off on 2026-06-02
  # when GitHub forces all actions onto Node.js 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-14      # Apple Silicon runner (covers both arm64 Macs and Intel Macs via Rosetta 2)
            asset_os: macos
            asset_arch: arm64
          # NOTE: macOS Intel (x86_64) build removed -- GitHub's `macos-13`
          # runner pool is being retired and jobs routinely queue for 30min+
          # without a runner. Intel Mac users can run the arm64 binary via
          # Rosetta 2 or install from source (`pip install -e agent/`).
          - target: linux-x86_64
            os: ubuntu-22.04
            asset_os: linux
            asset_arch: x86_64
          - target: linux-arm64
            os: ubuntu-22.04-arm
            asset_os: linux
            asset_arch: arm64
          - target: windows-x86_64
            os: windows-latest
            asset_os: windows
            asset_arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build binary with PyInstaller (POSIX)
        if: matrix.asset_os != 'windows'
        shell: bash
        run: |
          bash packaging/pyinstaller/build.sh

      - name: Build binary with PyInstaller (Windows)
        if: matrix.asset_os == 'windows'
        shell: pwsh
        run: |
          cd packaging/pyinstaller
          python -m venv .build-venv
          .build-venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip wheel
          pip install "${{ github.workspace }}\agent"
          pip install "pyinstaller>=6.6"
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          pyinstaller paperprism-agent.spec --clean --noconfirm
          Write-Host "Built:"
          Get-ChildItem dist\

      - name: Package tarball (POSIX)
        if: matrix.asset_os != 'windows'
        shell: bash
        run: |
          cd packaging/pyinstaller/dist
          TAR="paperprism-agent-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.tar.gz"
          tar -czf "${TAR}" paperprism-agent
          shasum -a 256 "${TAR}" | tee "${TAR}.sha256"
          ls -lh

      - name: Package zip (Windows)
        if: matrix.asset_os == 'windows'
        shell: pwsh
        run: |
          cd packaging/pyinstaller/dist
          $ZIP = "paperprism-agent-windows-x86_64.zip"
          Compress-Archive -Path paperprism-agent.exe -DestinationPath $ZIP
          $hash = (Get-FileHash $ZIP -Algorithm SHA256).Hash.ToLower()
          "$hash  $ZIP" | Out-File -Encoding utf8 "$ZIP.sha256"
          Get-ChildItem

      - name: Build macOS .pkg installer
        if: matrix.asset_os == 'macos'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "${GITHUB_REF_NAME}" ]; then
            VERSION="0.0.0-dev"
          fi
          bash packaging/macos/build_pkg.sh "${VERSION}"
          ls -lh packaging/macos/dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paperprism-agent-${{ matrix.target }}
          path: |
            packaging/pyinstaller/dist/paperprism-agent-*.tar.gz
            packaging/pyinstaller/dist/paperprism-agent-*.tar.gz.sha256
            packaging/pyinstaller/dist/paperprism-agent-*.zip
            packaging/pyinstaller/dist/paperprism-agent-*.zip.sha256
            packaging/macos/dist/*.pkg
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten assets
        run: |
          mkdir -p upload
          find release-assets -type f \( \
            -name '*.tar.gz' -o \
            -name '*.zip'    -o \
            -name '*.sha256' -o \
            -name '*.pkg'    \
          \) -exec cp {} upload/ \;
          ls -lh upload

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Install

            ### ⭐ Recommended — PyPI via `uv` (all platforms)
            ```
            uvx paperprism-agent serve                # one-off, no install
            uv tool install paperprism-agent          # persistent install
            paperprism-agent install                  # register auto-start service
            ```
            Requires [`uv`](https://docs.astral.sh/uv/). Works on macOS, Linux, and Windows.

            `paperprism-agent install` registers:
            - **macOS** → launchd LaunchAgent (`~/Library/LaunchAgents/`)
            - **Linux** → systemd --user unit (`~/.config/systemd/user/`)
            - **Windows** → Task Scheduler ONLOGON task (no admin rights needed)

            ### One-line shell installer (macOS / Linux)
            ```
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/packaging/install.sh | bash
            ```

            ### Windows — binary zip
            Download `paperprism-agent-windows-x86_64.zip` below, extract
            `paperprism-agent.exe` somewhere on your `PATH`, then run:
            ```
            paperprism-agent install
            ```

            ### macOS installer
            Download `paperprism-agent-*-macos-*.pkg` below and double-click.

            ### Homebrew (once the tap is published)
            ```
            brew tap ${{ github.repository_owner }}/paperprism
            brew install paperprism-agent
            brew services start paperprism-agent
            ```

            ### Manual (tarball / zip)
            Download the matching archive for your platform, extract the binary
            somewhere on your PATH, and run `paperprism-agent install`.

            ### Chrome extension
            Install from the
            [Chrome Web Store](https://chromewebstore.google.com/detail/jjlclcocagjnohgcpbgcpkodcnmmabif)
            — or load the latest `paperprism-extension-<ver>-chrome.zip`
            from this release unpacked via `chrome://extensions`.
  # Note: PyPI publish is a manual step.
  # Run `python -m build && twine upload dist/*` from `agent/` after tagging
  # (see agent/AGENTS.md → "Publishing to PyPI").
  # Automating this requires a `PYPI_API_TOKEN` secret or a PyPI Trusted
  # Publisher config — neither is configured on this repo yet.
