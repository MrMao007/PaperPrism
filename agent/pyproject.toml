[project]
name = "paperprism-agent"
version = "0.1.0"
description = "Local Agent for PaperPrism: receives download events from the Chrome extension and mirrors papers into a hidden vault."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "openai>=1.50.0",
    "anthropic>=0.39.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
paperprism-agent = "paperprism_agent.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperprism_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/paperprism_agent", "README.md", "pyproject.toml"]
