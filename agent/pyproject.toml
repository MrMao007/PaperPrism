[project]
name = "paperprism-agent"
version = "0.2.2"
description = "Local-first Agent for PaperPrism: receives arxiv download events from the Chrome extension and mirrors papers into a hidden vault with LLM-powered tagging."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache-2.0" }

authors = [
    { name = "MrMao007", email = "mty1209@gmail.com" },
]
keywords = [
    "arxiv",
    "papers",
    "research",
    "chrome-extension",
    "local-first",
    "pdf",
    "llm",
    "knowledge-management",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "openai>=1.50.0",
    "anthropic>=0.39.0",
    "python-multipart>=0.0.9",
    "pysqlite3>=0.5.0",
    "sqlite-vec>=0.1.0",
    "sentence-transformers>=3.0.0",
    "umap-learn>=0.5.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "feedparser>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/MrMao007/PaperPrism"
Repository = "https://github.com/MrMao007/PaperPrism"
Issues = "https://github.com/MrMao007/PaperPrism/issues"
Documentation = "https://github.com/MrMao007/PaperPrism#readme"
Changelog = "https://github.com/MrMao007/PaperPrism/releases"

[project.scripts]
paperprism-agent = "paperprism_agent.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# ---- wheel ----
# hatchling auto-includes everything under `packages`, including SQL
# migrations and default YAML resources. No need for force-include; adding
# it causes duplicate-name warnings during wheel build.
[tool.hatch.build.targets.wheel]
packages = ["src/paperprism_agent"]

# ---- sdist ----
# Ship enough for downstream rebuilds (build system + source + docs + license).
[tool.hatch.build.targets.sdist]
include = [
    "src/paperprism_agent",
    "README.md",
    "pyproject.toml",
    "LICENSE",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
]

# ---- pytest ----
# Tests live in agent/tests/. Add `src` to pythonpath so the suite runs even
# when paperprism_agent is not installed editable in the active venv.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
